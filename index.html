<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SHANGHAI GP · 俯视 F1</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="hud">
    <div class="panel" id="miniWrap"><canvas id="mini" width="200" height="140"></canvas></div>
    <div class="panel" id="stats">
      <div class="row"><span>LAP</span><b id="lap">1/3</b></div>
      <div class="row"><span>TIME</span><b id="time">0:00.00</b></div>
      <div class="row"><span>BEST</span><b id="best" class="hi">--:--.--</b></div>
      <div class="row"><span>LAST</span><b id="last">--:--.--</b></div>
    </div>
    <div class="panel" id="speedo"><b id="speed">0</b><span>KM/H</span></div>
    <div class="panel" id="help">J 油门　K 轻刹　L 重刹/倒车<br>← → 或 A D 转向　R 重开　M 静音</div>
    <div id="msg"><span id="msgMain"></span><span id="msgSub"></span></div>
    <div id="credits">Audio: engine loops by domasx2 (CC0) · F1 recordings by Edvvc (CC BY-SA 3.0) · tire squeal by audible-edge (CC BY 3.0)</div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
