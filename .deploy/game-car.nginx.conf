# 赛车游戏站点：静态前端 + /api 与 /ws 反代到本机 8081
# 原 erp.066808.xyz 站点已移至 /etc/nginx/disabled-sites/ 备份，可随时恢复
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root  /var/www/game-car;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/game-car.access.log;
    error_log  /var/log/nginx/game-car.error.log;

    client_max_body_size 8m;

    # 前端打包静态资源（文件名带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 音频等静态媒体
    location /music/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # REST API -> 游戏后端 8081
    location /api/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 网关 -> 游戏后端 8081（依赖 conf.d/websocket-upgrade.conf 的 $connection_upgrade）
    location /ws {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 单页入口（test.html / autopilot-doc.html 也是独立页面，直接命中文件）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
