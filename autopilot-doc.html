<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动驾驶算法 · 参数说明</title>
<style>
  :root {
    --bg: #070c14;
    --line: rgba(160, 200, 250, .18);
    --text: #dbe6f4;
    --dim: #8ba1b8;
    --accent: #00e5ff;
    --green: #00ffb4;
    --amber: #ffd166;
    --red: #e10600;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 0%, #0d1624 0%, #070c14 60%, #04070c 100%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", ui-monospace, monospace;
    line-height: 1.75;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .topbar {
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .badge {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .15em;
    padding: 3px 9px;
    border-radius: 3px;
  }
  .back {
    font-size: 12px;
    font-weight: 800;
    color: var(--green);
    border: 1px solid rgba(0, 255, 180, .4);
    background: rgba(0, 255, 180, .1);
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
  }
  .back:hover { color: #fff; text-decoration: none; border-color: var(--green); }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px 20px 90px; }
  .wrap > :first-child { margin-top: 0; }

  h1 {
    margin: 18px 0 8px;
    font-size: clamp(22px, 3vw, 32px);
    letter-spacing: .03em;
    line-height: 1.3;
  }
  h2 {
    margin: 42px 0 14px;
    font-size: 19px;
    color: #f8fafc;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
    scroll-margin-top: 16px;
  }
  h3 {
    margin: 26px 0 10px;
    font-size: 14.5px;
    color: var(--amber);
    letter-spacing: .04em;
    scroll-margin-top: 16px;
  }
  h4 { margin: 20px 0 8px; font-size: 13px; color: #cbd5e1; }
  p, li { font-size: 13.5px; }
  p { margin: 10px 0; }
  ul, ol { margin: 10px 0; padding-left: 22px; }
  li { margin: 5px 0; }
  strong { color: #fff; font-weight: 800; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

  code {
    font-family: ui-monospace, "Cascadia Code", "Courier New", monospace;
    background: rgba(0, 229, 255, .1);
    border: 1px solid rgba(0, 229, 255, .18);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
    color: #9be8ff;
    word-break: break-word;
  }
  pre {
    background: #060b13;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.6;
    margin: 14px 0;
  }
  pre code {
    background: none;
    border: 0;
    padding: 0;
    color: #d7e3f4;
    white-space: pre;
    word-break: normal;
  }

  blockquote {
    margin: 16px 0;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(16, 24, 36, .9), rgba(10, 17, 27, .9));
    border: 1px solid var(--line);
    border-left: 3px solid var(--green);
    border-radius: 8px;
  }
  blockquote p { margin: 4px 0; color: #c7d5e5; }
  blockquote p:first-child { margin-top: 0; }
  blockquote p:last-child { margin-bottom: 0; }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    margin: 12px 0 6px;
    border: 1px solid rgba(160, 200, 250, .1);
    border-radius: 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(160, 200, 250, .1);
    vertical-align: top;
  }
  th {
    color: var(--dim);
    font-weight: 800;
    letter-spacing: .04em;
    background: rgba(160, 200, 250, .06);
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: 0; }
  td code { background: none; border: 0; color: var(--green); padding: 0; }

  .doc-foot {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 40px;
    color: var(--dim);
    font-size: 11px;
  }
  .doc-foot code { font-size: 10.5px; }
  .doc-foot a { color: #9fb4c9; }

  @media (max-width: 640px) {
    .topbar { padding-top: 14px; }
    .wrap { padding: 12px 14px 70px; }
    h2 { margin-top: 32px; }
    p, li { font-size: 13px; }
    pre { font-size: 11.5px; padding: 12px; }
    .table-wrap { -webkit-overflow-scrolling: touch; }
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="badge">AUTOPILOT · DRIVER ALGORITHM</span>
  <a class="back" href="./">← 返回游戏</a>
</div>
<main id="doc" class="wrap"></main>
<footer class="doc-foot">
  文档源文件：<a href="./autopilot-doc.md" id="docSource"><code>autopilot-doc.md</code></a> · 本页面直接读取并渲染这份 Markdown
  <noscript>（需要启用 JavaScript 才能渲染；也可以直接打开上面的 Markdown 文件）</noscript>
</footer>

<script type="module">
import doc from "./autopilot-doc.md?raw";

const docEl = document.getElementById("doc");

// 构建产物不会复制根目录的 .md，改用 Blob 让源文件链接在 dist 里也能打开
const sourceLink = document.getElementById("docSource");
if (sourceLink) {
  sourceLink.href = URL.createObjectURL(new Blob([doc], { type: "text/markdown;charset=utf-8" }));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[ch]));
}

function inline(text) {
  const codes = [];
  let out = String(text).replace(/`([^`]+)`/g, (_, code) => {
    codes.push(`<code>${escapeHtml(code)}</code>`);
    return `\u0000${codes.length - 1}\u0000`;
  });
  out = escapeHtml(out);
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, href) => {
    const url = /^(#|\.{0,2}\/|https?:\/\/|mailto:)/.test(href) ? href : "#";
    return `<a href="${url}">${label}</a>`;
  });
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  out = out.replace(/\u0000(\d+)\u0000/g, (_, index) => codes[Number(index)]);
  return out;
}

function splitRow(line) {
  let text = line.trim();
  if (text.startsWith("|")) text = text.slice(1);
  if (text.endsWith("|")) text = text.slice(0, -1);
  const cells = [];
  let current = "";
  let inCode = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === "`") { inCode = !inCode; current += ch; continue; }
    if (ch === "|" && !inCode) { cells.push(current.trim()); current = ""; continue; }
    current += ch;
  }
  cells.push(current.trim());
  return cells;
}

const isTableSeparator = (line) =>
  /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);

function renderMarkdown(source) {
  const lines = String(source).replace(/\r\n?/g, "\n").split("\n");
  const html = [];
  let paragraph = [];
  let i = 0;

  const flushParagraph = () => {
    if (!paragraph.length) return;
    html.push(`<p>${inline(paragraph.join(" "))}</p>`);
    paragraph = [];
  };

  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line.trim())) {
      flushParagraph();
      const lang = line.trim().slice(3).trim().replace(/[^\w-]/g, "");
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) {
        code.push(lines[i]);
        i++;
      }
      i++;
      html.push(`<pre><code${lang ? ` class="language-${lang}"` : ""}>${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flushParagraph();
      let text = heading[2].trim();
      let id = "";
      const idMatch = text.match(/\s*\{#([\w-]+)\}\s*$/);
      if (idMatch) {
        id = idMatch[1];
        text = text.slice(0, idMatch.index).trim();
      }
      const level = heading[1].length;
      html.push(`<h${level}${id ? ` id="${id}"` : ""}>${inline(text)}</h${level}>`);
      i++;
      continue;
    }

    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) {
      flushParagraph();
      html.push("<hr>");
      i++;
      continue;
    }

    if (/^\s*\|/.test(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
      flushParagraph();
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        rows.push(splitRow(lines[i]));
        i++;
      }
      const thead = head.map((cell) => `<th>${inline(cell)}</th>`).join("");
      const tbody = rows
        .map((row) => `<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join("")}</tr>`)
        .join("");
      html.push(`<div class="table-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`);
      continue;
    }

    if (/^\s*>/.test(line)) {
      flushParagraph();
      const quoted = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        quoted.push(lines[i].replace(/^\s*>\s?/, ""));
        i++;
      }
      html.push(`<blockquote>${renderMarkdown(quoted.join("\n"))}</blockquote>`);
      continue;
    }

    const listItem = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (listItem) {
      flushParagraph();
      const ordered = /\d+\./.test(listItem[1]);
      const items = [];
      while (i < lines.length) {
        const item = lines[i].match(/^\s*([-*]|\d+\.)\s+(.*)$/);
        if (!item) break;
        items.push(item[2]);
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      html.push(`<${tag}>${items.map((item) => `<li>${inline(item)}</li>`).join("")}</${tag}>`);
      continue;
    }

    if (!line.trim()) {
      flushParagraph();
      i++;
      continue;
    }

    paragraph.push(line.trim());
    i++;
  }

  flushParagraph();
  return html.join("\n");
}

docEl.innerHTML = renderMarkdown(doc);
</script>
</body>
</html>
